<h2>Nuestro menú</h2>

<ul>
  @for (producto of productos; track producto.nombre) {
    <li>
      {{ producto.nombre }} — ${{ producto.precio }}
      @if (producto.disponible) {
        <button (click)="agregar(producto)">Agregar</button>
      } @else {
        <strong>(Agotado)</strong>
      }
    </li>
  }
</ul>

<h3>Total del pedido: ${{ total() }}</h3>
<button (click)="vaciar()">Vaciar pedido</button>
